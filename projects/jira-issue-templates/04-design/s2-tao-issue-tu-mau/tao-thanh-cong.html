<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Jira Automation - Tạo thành công</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600&amp;family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "success-container": "#B7F0C4",
                        "on-success-container": "#002110",
                        "scrim": "#051a3e",
                        "surface-variant": "#d8e2ff",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "secondary-container": "#709bfe",
                        "on-surface-variant": "#434654",
                        "on-tertiary-fixed": "#380d00",
                        "tertiary-fixed-dim": "#ffb59b",
                        "surface-container-high": "#e1e8ff",
                        "tertiary-fixed": "#ffdbcf",
                        "surface-container-low": "#f1f3ff",
                        "on-error-container": "#93000a",
                        "outline": "#737685",
                        "inverse-on-surface": "#edf0ff",
                        "inverse-surface": "#1d3054",
                        "error-container": "#ffdad6",
                        "surface-container": "#e9edff",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#051a3e",
                        "tertiary": "#7b2600",
                        "surface": "#faf9ff",
                        "on-primary-fixed-variant": "#0040a2",
                        "secondary-fixed": "#d9e2ff",
                        "outline-variant": "#c3c6d6",
                        "background": "#faf9ff",
                        "primary-fixed": "#dae2ff",
                        "on-tertiary-fixed-variant": "#812800",
                        "surface-bright": "#faf9ff",
                        "inverse-primary": "#b2c5ff",
                        "on-primary-fixed": "#001848",
                        "secondary-fixed-dim": "#b1c6ff",
                        "on-background": "#051a3e",
                        "surface-dim": "#ccdaff",
                        "error": "#ba1a1a",
                        "secondary": "#285ab9",
                        "surface-container-highest": "#d8e2ff",
                        "on-tertiary-container": "#ffc6b2",
                        "on-secondary-fixed": "#001946",
                        "on-primary-container": "#c4d2ff",
                        "surface-tint": "#0c56d0",
                        "on-secondary-fixed-variant": "#00419d",
                        "on-secondary-container": "#003179",
                        "primary-fixed-dim": "#b2c5ff",
                        "primary-container": "#0052cc",
                        "primary": "#003d9b",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#a33500"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    spacing: {
                        "layout-margin": "24px",
                        "xl": "24px",
                        "base": "4px",
                        "sm": "8px",
                        "md": "12px",
                        "xs": "4px",
                        "lg": "16px",
                        "layout-gutter": "16px"
                    },
                    fontFamily: {
                        "h3": ["Hanken Grotesk"],
                        "h1": ["Hanken Grotesk"],
                        "label-md": ["Inter"],
                        "h2": ["Hanken Grotesk"],
                        "body-lg": ["Inter"],
                        "mono": ["JetBrains Mono"],
                        "label-xs": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    fontSize: {
                        "h3": ["16px", { lineHeight: "24px", fontWeight: "600" }],
                        "h1": ["24px", { lineHeight: "32px", fontWeight: "600" }],
                        "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
                        "h2": ["20px", { lineHeight: "28px", fontWeight: "600" }],
                        "body-lg": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "mono": ["12px", { lineHeight: "16px", fontWeight: "400" }],
                        "label-xs": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "700" }],
                        "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-lg h-screen flex overflow-hidden">
<!-- Blurred Background (Mock Form Layout) -->
<div class="flex w-full h-full filter blur-[2px] opacity-60 pointer-events-none transition-all duration-300">
<!-- SideNav (Mock) -->
<nav class="fixed left-0 top-0 h-full w-[240px] bg-surface border-r border-outline-variant flex flex-col p-md space-y-sm z-10">
<div class="flex items-center space-x-md p-sm mb-lg">
<span class="material-symbols-outlined text-primary text-h2 font-h2 font-bold" style="font-variation-settings: 'FILL' 1;">dataset</span>
<div>
<h2 class="text-h3 font-h3 font-bold text-on-surface">Jira Automation</h2>
<p class="text-label-xs font-label-xs text-on-surface-variant uppercase">Project Selector</p>
</div>
</div>
<div class="flex-1 space-y-xs mt-sm">
<a class="flex items-center space-x-sm px-sm py-[8px] text-primary bg-secondary-fixed font-bold rounded-lg text-label-md font-label-md" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">description</span>
<span>Mẫu issue</span>
</a>
<a class="flex items-center space-x-sm px-sm py-[8px] text-on-surface-variant hover:bg-surface-container-high rounded-lg text-label-md font-label-md transition-colors duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span>Lịch sử issue</span>
</a>
<a class="flex items-center space-x-sm px-sm py-[8px] text-on-surface-variant hover:bg-surface-container-high rounded-lg text-label-md font-label-md transition-colors duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span>Cấu hình dự án</span>
</a>
</div>
</nav>
<!-- Main Content Area (Mock) -->
<div class="ml-[240px] flex-1 flex flex-col h-full bg-background relative z-0">
<!-- TopAppBar (Mock) -->
<header class="docked full-width top-0 bg-surface border-b border-outline-variant flex justify-between items-center h-16 px-xl sticky z-20 shadow-sm">
<div class="flex items-center space-x-lg">
<!-- Nav links hidden here, simulated by generic header layout -->
</div>
<div class="flex items-center space-x-md">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">notifications</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
</div>
</header>
<main class="flex-1 p-xl overflow-y-auto bg-surface-container-lowest">
<div class="max-w-[800px] mx-auto bg-surface border border-outline-variant rounded-lg p-xl h-full shadow-sm">
<div class="h-6 w-1/3 bg-surface-variant rounded mb-lg animate-pulse"></div>
<div class="space-y-md">
<div class="h-10 w-full bg-surface-container-high rounded border border-outline-variant animate-pulse"></div>
<div class="h-32 w-full bg-surface-container-high rounded border border-outline-variant animate-pulse"></div>
<div class="flex space-x-md">
<div class="h-10 w-1/2 bg-surface-container-high rounded border border-outline-variant animate-pulse"></div>
<div class="h-10 w-1/2 bg-surface-container-high rounded border border-outline-variant animate-pulse"></div>
</div>
</div>
</div>
</main>
</div>
</div>
<!-- Success Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-scrim/40 backdrop-blur-sm transition-opacity duration-300">
<!-- Modal Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_24px_rgba(9,30,66,0.2)] w-full max-w-[480px] p-xl flex flex-col items-center text-center transform transition-all duration-300 scale-100 opacity-100 border border-outline-variant">
<!-- Icon Container -->
<div class="w-16 h-16 rounded-full bg-success-container text-on-success-container flex items-center justify-center mb-md shadow-sm border border-success-container">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Title & Status -->
<h2 class="text-h2 font-h2 text-on-surface mb-sm">Tạo issue thành công</h2>
<div class="flex flex-col items-center justify-center space-y-xs mb-lg w-full bg-surface-container rounded-lg p-md border border-outline-variant/50">
<p class="text-body-lg font-body-lg text-on-surface-variant">
                    Issue <span class="font-bold text-primary font-mono tracking-tight">ITSUP-2483</span> đã được tạo tự động.
                </p>
<div class="flex items-center space-x-sm mt-xs">
<span class="text-label-xs font-label-xs text-on-surface-variant uppercase tracking-wider">Trạng thái:</span>
<span class="inline-flex items-center px-2 py-1 rounded bg-success-container text-on-success-container text-label-xs font-label-xs font-bold uppercase tracking-wider border border-success-container">
                        Đã xong (Done)
                    </span>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full space-y-sm">
<!-- Primary Action -->
<button class="w-full h-[40px] flex items-center justify-center space-x-sm bg-primary-container text-on-primary hover:opacity-90 rounded-lg text-label-md font-label-md transition-opacity shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-[18px]">add_box</span>
<span>Tạo tiếp từ mẫu này</span>
</button>
<div class="flex space-x-sm w-full">
<!-- Secondary Action (Link Out) -->
<a class="flex-1 h-[40px] flex items-center justify-center space-x-sm bg-surface-container-high text-on-surface hover:bg-surface-variant rounded-lg text-label-md font-label-md transition-colors border border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" href="#">
<span>Mở trên Jira</span>
<span class="material-symbols-outlined text-[16px]">open_in_new</span>
</a>
<!-- Outline Action -->
<button class="flex-1 h-[40px] flex items-center justify-center space-x-sm bg-transparent text-primary hover:bg-primary-fixed rounded-lg text-label-md font-label-md transition-colors border border-primary focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-[16px]">list</span>
<span>Về danh sách mẫu</span>
</button>
</div>
</div>
<!-- Minimal close top right -->
<button class="absolute top-sm right-sm w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-variant rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
</body></html>
